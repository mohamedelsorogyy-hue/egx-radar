name: تحديث بيانات البورصة

on:
  schedule:
    # المصدر بينزّل إغلاق الجلسة متأخر ومواعيده مش ثابتة — قِسناها:
    # الساعة 9 مساءً بالقاهرة لسه بيعرض جلسة امبارح.
    # فبدل ما نخمّن ميعاد واحد، بنجرّب كذا مرة. لو مفيش داتا جديدة
    # مفيش commit، والتشغيل الزيادة تكلفته صفر (GitHub Actions مجاني).
    # كل الأوقات UTC — القاهرة صيفاً = UTC+3.
    - cron: "0 20 * * *"    # 11 مساءً بالقاهرة
    - cron: "0 22 * * *"    #  1 صباحاً
    - cron: "0 5  * * *"    #  8 صباحاً
    - cron: "0 10 * * *"    #  1 ظهراً
    - cron: "0 15 * * *"    #  6 مساءً
  workflow_dispatch:        # تشغيل يدوي من واجهة GitHub

# صلاحية الكتابة عشان يقدر يعمل commit للداتا الجديدة
permissions:
  contents: write

concurrency:
  group: egx-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # مفيش pip install — السكريبتات كلها على مكتبات بايثون الأساسية

      - name: تشغيل خط الأنابيب
        run: python3 run_all.py

      - name: حفظ الداتا الجديدة
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add egx_data.csv egx_shortlist.csv egx_technical.csv arabic_names.json \
                  dashboard/data.json dashboard/candles dashboard/news dashboard/news.json dashboard/names_ar.json

          # لو مفيش تغيير (عطلة رسمية مثلاً) منعملش commit فاضي
          if git diff --staged --quiet; then
            echo "مفيش تغيير في الداتا — يمكن يوم إجازة"
            exit 0
          fi

          TRADE_DATE=$(python3 -c "import json;print(json.load(open('dashboard/data.json'))['tradeDate'])")
          git commit -m "بيانات جلسة $TRADE_DATE"
          git push

      # النشر على Cloudflare Pages. بيشتغل حتى لو مفيش commit جديد
      # عشان لو الخطوة السابقة فشلت لأي سبب، الموقع يفضل متطابق مع آخر داتا.
      - name: النشر على Cloudflare Pages
        if: always()
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard --project-name=egx-radar --branch=main
